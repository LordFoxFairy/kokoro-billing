name: Publish Billing image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kokoro_billing
          POSTGRES_USER: kokoro_app
          POSTGRES_PASSWORD: example-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kokoro_app -d kokoro_billing"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://kokoro_app:example-password@127.0.0.1:5432/kokoro_billing
      SCHEMA_ADMIN_URL: postgresql://kokoro_app:example-password@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install canonical PostgreSQL schema
        run: pnpm db:apply-schema
      - name: Run real infrastructure integration tests
        run: pnpm test:integration
      - name: Verify canonical PostgreSQL catalog
        run: pnpm db:verify-schema
      - name: Verify generated Prisma artifacts
        run: pnpm prisma:generate && pnpm prisma:check
      - name: Verify repository
        run: pnpm verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kokoro_billing
          POSTGRES_USER: kokoro_app
          POSTGRES_PASSWORD: example-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kokoro_app -d kokoro_billing"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      CANDIDATE_IMAGE: kokoro-billing-release-candidate:${{ github.sha }}
      DATABASE_URL: postgresql://kokoro_app:example-password@127.0.0.1:5432/kokoro_billing
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build local release candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan release candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.CANDIDATE_IMAGE }}
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Smoke-test release candidate
        shell: bash
        run: |
          set -euo pipefail
          cleanup() { docker rm --force kokoro-billing-release-candidate >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --detach --name kokoro-billing-release-candidate --network host \
            --env DATABASE_URL \
            --env REDIS_URL \
            --env INTERNAL_SERVICE_SECRET=release-fixture-internal-secret \
            --env BILLING_BFF_SERVICE_TOKEN=release-fixture-bff-token \
            --env BILLING_OPERATOR_PROXY_SECRET=release-fixture-operator-secret \
            --env BILLING_AUTH_MODE=jwks \
            --env BILLING_AUTH_JWKS_URL=http://127.0.0.1:9/release-fixture-jwks.json \
            --env BILLING_HOST=127.0.0.1 \
            "${CANDIDATE_IMAGE}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4245/healthz >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:4245/readyz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs kokoro-billing-release-candidate
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
