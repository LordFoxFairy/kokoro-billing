name: Billing CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kokoro_billing
          POSTGRES_USER: kokoro_app
          POSTGRES_PASSWORD: example-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kokoro_app -d kokoro_billing"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://kokoro_app:example-password@127.0.0.1:5432/kokoro_billing
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan dependencies, source configuration, and secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install canonical PostgreSQL schema
        run: pnpm db:apply-schema

      - name: Run real infrastructure integration tests
        run: pnpm test:integration

      - name: Verify repository
        run: pnpm verify

      - name: Build production image
        run: docker build --tag kokoro-billing:ci .
