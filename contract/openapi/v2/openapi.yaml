components:
  headers:
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
  parameters:
    TenantId:
      name: x-kokoro-tenant-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[\x20-\x7E]+$
    ConsumptionToken:
      name: x-billing-consumption-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    OperatorId:
      name: x-kokoro-operator-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    WechatTimestamp:
      name: Wechatpay-Timestamp
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    WechatNonce:
      name: Wechatpay-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  securitySchemes:
    tenantContext:
      type: apiKey
      in: header
      name: x-kokoro-tenant-id
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceCaller:
      type: apiKey
      in: header
      name: x-kokoro-service
    adminService:
      type: apiKey
      in: header
      name: x-kokoro-service
      description: Must equal admin.
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service
    subjectContext:
      type: apiKey
      in: header
      name: x-kokoro-subject
    operatorContext:
      type: apiKey
      in: header
      name: x-kokoro-operator
    adminRole:
      type: apiKey
      in: header
      name: x-kokoro-role
      description: Must equal billing.admin.
    operatorProxySecret:
      type: apiKey
      in: header
      name: x-kokoro-proxy-secret
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
    wechatSignature:
      type: apiKey
      in: header
      name: Wechatpay-Signature
  schemas:
    Uuid:
      type: string
      format: uuid
    UtcInstant:
      type: string
      format: date-time
      pattern: Z$
    DecimalInteger:
      type: string
      pattern: ^-?(?:0|[1-9][0-9]*)$
    NonNegativeDecimal:
      type: string
      pattern: ^(?:0|[1-9][0-9]*)$
    PositiveDecimal:
      type: string
      pattern: ^[1-9][0-9]*$
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
              pattern: ^billing\.[a-z0-9_]+$
            message:
              type: string
              minLength: 1
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties:
                type: string
                maxLength: 512
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              const: ok
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - status
            - dependencies
          properties:
            status:
              type: string
              enum:
                - ready
                - not_ready
            dependencies:
              type: object
              additionalProperties: false
              required:
                - postgres
                - redis
              properties:
                postgres:
                  type: string
                  enum:
                    - ok
                    - unavailable
                redis:
                  type: string
                  enum:
                    - ok
                    - degraded
    Page:
      type: object
      additionalProperties: false
      required:
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - "null"
    BillingSubject:
      type: object
      additionalProperties: false
      required:
        - kind
        - ref
      properties:
        kind:
          type: string
          enum:
            - user
            - project
            - organization
            - service
        ref:
          type: string
          minLength: 1
          maxLength: 255
    CatalogItem:
      type: object
      additionalProperties: false
      required:
        - offer_revision_id
        - name
        - amount_minor
        - currency_code
        - credit_micros
        - billing_interval
      properties:
        offer_revision_id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        amount_minor:
          $ref: "#/components/schemas/NonNegativeDecimal"
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        credit_micros:
          $ref: "#/components/schemas/NonNegativeDecimal"
        billing_interval:
          type: string
          enum:
            - once
            - month
            - year
    CatalogResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - page
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CatalogItem"
            page:
              $ref: "#/components/schemas/Page"
    CreditAccount:
      type: object
      additionalProperties: false
      required:
        - credit_account_id
        - status
        - available_micros
        - held_micros
      properties:
        credit_account_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum:
            - active
            - disabled
        available_micros:
          $ref: "#/components/schemas/NonNegativeDecimal"
        held_micros:
          $ref: "#/components/schemas/NonNegativeDecimal"
    CreditAccountResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CreditAccount"
    LedgerEntry:
      type: object
      additionalProperties: false
      required:
        - journal_id
        - sequence
        - delta_micros
        - balance_after_micros
        - source_kind
        - source_ref
        - created_at
      properties:
        journal_id:
          $ref: "#/components/schemas/Uuid"
        sequence:
          $ref: "#/components/schemas/NonNegativeDecimal"
        delta_micros:
          $ref: "#/components/schemas/DecimalInteger"
        balance_after_micros:
          $ref: "#/components/schemas/NonNegativeDecimal"
        source_kind:
          type: string
          minLength: 1
        source_ref:
          type: string
          minLength: 1
          maxLength: 255
        created_at:
          $ref: "#/components/schemas/UtcInstant"
    CreditLedgerResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - page
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LedgerEntry"
            page:
              $ref: "#/components/schemas/Page"
    Subscription:
      type: object
      additionalProperties: false
      required:
        - subscription_id
        - provider_status
        - term_id
        - term_status
        - grant_status
        - period_start
        - period_end
        - grant_micros
      properties:
        subscription_id:
          $ref: "#/components/schemas/Uuid"
        provider_status:
          type: string
          enum:
            - incomplete
            - incomplete_expired
            - trialing
            - active
            - past_due
            - canceled
            - unpaid
            - paused
            - unknown
        term_id:
          type:
            - string
            - "null"
          format: uuid
        term_status:
          type:
            - string
            - "null"
          enum:
            - active
            - past_due
            - canceled
            - expired
            - null
        grant_status:
          type: string
          enum:
            - waiting_evidence
            - waiting_period_start
            - pending
            - applied
            - review_required
        period_start:
          $ref: "#/components/schemas/UtcInstant"
        period_end:
          $ref: "#/components/schemas/UtcInstant"
        grant_micros:
          $ref: "#/components/schemas/NonNegativeDecimal"
    SubscriptionsResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: object
          additionalProperties: false
          required:
            - items
            - page
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Subscription"
            page:
              $ref: "#/components/schemas/Page"
    AdmissionCreateRequest:
