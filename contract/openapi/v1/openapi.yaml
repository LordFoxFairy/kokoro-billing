openapi: 3.0.3
info:
  title: Kokoro Billing API v1
  version: 1.0.0
  description: User, admin, internal and provider-webhook contracts for kokoro-billing.
servers:
  - url: https://TARGET
security: []
tags:
  - name: User
  - name: Admin
  - name: Internal
  - name: Webhook
  - name: Operations
paths:
  /healthz:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /readyz:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ready"
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /v1/commerce/catalog:
    get:
      tags:
        - User
      description: "The storefront catalog accepts either an IAM user JWT or the
        trusted web-bff service-auth form. The BFF form requires
        X-Kokoro-Service=web-bff, X-Kokoro-Internal-Secret, Authorization:
        Bearer BFF_SERVICE_TOKEN, and X-Kokoro-Tenant-Id."
      security:
        - tenantContext: []
          userBearer: []
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
          serviceBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/V1Plans"
        "401":
          $ref: "#/components/responses/V1Error"
        "403":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/credit-account:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      responses:
        "200":
          $ref: "#/components/responses/V1CreditAccount"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/credit-ledger:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/V1Ledger"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions/{admissionId}/capture:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions/{admissionId}/release:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/billing/execution-events:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/V1ExecutionEventRequest"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/payment/settlements/accept:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/payment/refunds/accept:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/commands/expire-credit-holds:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/webhooks/payment/{provider}:
    post:
      tags:
        - Webhook
      security:
        - stripeSignature: []
        - wechatSignature: []
        - alipayBodySignature: []
        - mockSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/subscriptions:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/V1Generic"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/checkout:
    post:
      tags:
        - User
      description: The storefront checkout accepts either an IAM user JWT or the
        trusted web-bff service-auth form. The BFF form additionally requires
        the authenticated X-Kokoro-Subject context so Billing can bind the
        checkout to the user.
      security:
        - tenantContext: []
          userBearer: []
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
          serviceBearer: []
          subjectContext: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/V1CheckoutRequest"
      responses:
        "201":
          $ref: "#/components/responses/V1Checkout"
        "400":
          $ref: "#/components/responses/V1Error"
        "401":
          $ref: "#/components/responses/V1Error"
        "403":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/admin/billing/refunds:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
components:
  securitySchemes:
    tenantContext:
      type: apiKey
      in: header
      name: X-Kokoro-Tenant-Id
      description: Opaque tenant context at most 191 characters; for User routes it
        must match the IAM JWT tenant_id claim.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: IAM RS256/JWKS access token.
    serviceCaller:
      type: apiKey
      in: header
      name: X-Kokoro-Service
      description: Registered internal caller identity.
    internalSecret:
      type: apiKey
      in: header
      name: X-Kokoro-Internal-Secret
      description: Per-caller internal credential.
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service
      description: "BFF service credential carried as Authorization: Bearer
        BFF_SERVICE_TOKEN; it is checked together with X-Kokoro-Service and
        X-Kokoro-Internal-Secret."
    subjectContext:
      type: apiKey
      in: header
      name: X-Kokoro-Subject
      description: Trusted subject context injected by web-bff; required for the BFF
        checkout alternative and never accepted from a browser.
    operatorContext:
      type: apiKey
      in: header
      name: X-Kokoro-Operator
      description: Authenticated operator identity injected by the admin gateway.
    adminRole:
      type: apiKey
      in: header
      name: X-Kokoro-Role
      description: Authorized billing admin role injected by the admin gateway.
    operatorProxySecret:
      type: apiKey
      in: header
      name: X-Kokoro-Proxy-Secret
      description: Dedicated admin gateway credential; distinct from the internal
        service secret.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe signed raw-body header.
    wechatSignature:
      type: apiKey
      in: header
      name: Wechatpay-Signature
      description: WeChat Pay signed raw-body header; timestamp and nonce are also required.
    alipayBodySignature:
      type: apiKey
      in: query
      name: sign
      description: Alipay RSA2 signature is carried in the signed form body; this
        scheme documents the body field rather than a header.
    mockSignature:
      type: apiKey
      in: header
      name: X-Kokoro-Webhook-Signature
      description: Local fixture-only HMAC signature.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  requestBodies:
    V1CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1CheckoutRequest"
    V1ExecutionEventRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1ExecutionEventRequest"
  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - module
            - status
          properties:
            module:
              type: string
              enum:
                - kokoro-billing
            status:
              type: string
              enum:
                - ok
    ReadyResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - module
            - status
            - dependencies
          properties:
            module:
              type: string
              enum:
                - kokoro-billing
            status:
              type: string
              enum:
                - ready
            dependencies:
              type: object
              required:
                - postgres
                - redis
              properties:
                postgres:
                  type: string
                  enum:
                    - ok
                redis:
                  type: string
                  enum:
                    - ok
    Error:
      $ref: "#/components/schemas/V1ErrorResponse"
    V1Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
    V1GenericData:
      type: object
      additionalProperties: true
    V1SuccessResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1GenericData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
            - details
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CheckoutRequest:
      type: object
      required:
        - offer_revision_id
        - amount_minor
        - currency
        - quote_snapshot
      additionalProperties: false
      properties:
        offer_revision_id:
          type: string
        amount_minor:
          type: string
          pattern: ^[1-9][0-9]*$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        quote_snapshot:
          $ref: "#/components/schemas/V1QuoteSnapshot"
    V1QuoteSnapshot:
      type: object
      required:
        - key
        - credit_micros
      properties:
        key:
          type: string
          minLength: 1
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        name:
          type: string
      additionalProperties: true
    V1ExecutionEventRequest:
      type: object
      required:
        - event_id
        - event_type
        - execution_id
        - invocation_id
        - occurred_at
        - receipt_schema_version
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 255
        event_type:
          type: string
          enum:
            - execution.waiting
            - execution.accepted
            - execution.rejected
            - execution.failed
            - execution.unknown
        execution_id:
          type: string
          minLength: 1
          maxLength: 255
        invocation_id:
          type: string
          minLength: 1
          maxLength: 255
        occurred_at:
          type: string
          format: date-time
        receipt_schema_version:
          type: string
          minLength: 1
          maxLength: 32
        receipt:
          type: object
          additionalProperties: true
    V1Plan:
      type: object
      required:
        - id
        - key
        - name
        - currency
        - amount_minor
        - credit_micros
        - billing_interval
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount_minor:
          type: string
          pattern: ^[0-9]+$
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        billing_interval:
          type: string
          enum:
            - once
            - month
            - year
    V1PlansData:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/V1Plan"
        next_cursor:
          type: string
    V1CreditAccountData:
      type: object
      required:
        - account_id
        - status
        - available_micros
        - held_micros
        - generation
        - grants
      properties:
        account_id:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        available_micros:
          type: string
          pattern: ^[0-9]+$
        held_micros:
          type: string
          pattern: ^[0-9]+$
        generation:
          type: string
          pattern: ^[0-9]+$
        grants:
          type: array
          items:
            type: object
            required:
              - credit_grant_id
              - program_key
              - original_micros
              - remaining_micros
              - effective_at
              - expires_at
              - burn_priority
              - status
            properties:
              credit_grant_id:
                type: string
              program_key:
                type: string
              original_micros:
                type: string
                pattern: ^[0-9]+$
              remaining_micros:
                type: string
                pattern: ^[0-9]+$
              effective_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
                nullable: true
              burn_priority:
                type: integer
              status:
                type: string
    V1LedgerEntry:
      type: object
      required:
        - entry_id
        - delta_micros
        - balance_after_micros
        - reason
        - created_at
        - run_id
      properties:
        entry_id:
          type: string
        delta_micros:
          type: string
          pattern: ^-?[0-9]+$
        balance_after_micros:
          type: string
          pattern: ^-?[0-9]+$
        reason:
          type: string
        created_at:
          type: integer
          format: int64
        run_id:
          type: string
          nullable: true
    V1LedgerData:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/V1LedgerEntry"
        next_cursor:
          type: string
    V1CheckoutData:
      type: object
      required:
        - checkout_id
        - status
        - amount_minor
        - currency
        - expires_at
      properties:
        checkout_id:
          type: string
        status:
          type: string
          enum:
            - created
            - pending_payment
            - paid
            - cancelled
            - expired
        amount_minor:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        expires_at:
          type: string
          format: date-time
        checkout_url:
          type: string
          format: uri
    V1PlansResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1PlansData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CreditAccountResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1CreditAccountData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1LedgerResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1LedgerData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CheckoutResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1CheckoutData"
        meta:
          $ref: "#/components/schemas/V1Meta"
  responses:
    Health:
      description: Liveness response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthResponse"
    Ready:
      description: Readiness response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReadyResponse"
    V1Generic:
      description: v1 response with a snake_case wire payload.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1SuccessResponse"
    V1Accepted:
      description: v1 response accepted for processing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1SuccessResponse"
    V1Plans:
      description: v1 storefront catalog.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1PlansResponse"
    V1CreditAccount:
      description: v1 credit account.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1CreditAccountResponse"
    V1Ledger:
      description: v1 credit ledger page.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1LedgerResponse"
    V1Checkout:
      description: v1 checkout.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1CheckoutResponse"
    V1Error:
      description: v1 error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1ErrorResponse"
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
