components:
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
  parameters:
    PersonalTenantId:
      name: x-kokoro-tenant-id
      in: header
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 1022
        pattern: ^u1\.(?=[A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048]|[A-Za-z0-9_-][AQgw])?$(?![\s\S])
    PersonalSubjectId:
      name: x-kokoro-subject
      in: header
      required: false
      schema:
        type: string
        minLength: 5
        maxLength: 1363
        pattern: ^u1\.(?=[A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048]|[A-Za-z0-9_-][AQgw])?$(?![\s\S])
    TenantId:
      name: x-kokoro-tenant-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[\x20-\x7E]+$
    OperatorId:
      name: x-kokoro-operator-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    WechatTimestamp:
      name: Wechatpay-Timestamp
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    WechatNonce:
      name: Wechatpay-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  securitySchemes:
    tenantContext:
      type: apiKey
      in: header
      name: x-kokoro-tenant-id
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceCaller:
      type: apiKey
      in: header
      name: x-kokoro-service
    adminService:
      type: apiKey
      in: header
      name: x-kokoro-service
      description: Must equal admin.
    internalSecret:
      type: apiKey
      in: header
      name: x-kokoro-internal-secret
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service
    subjectContext:
      type: apiKey
      in: header
      name: x-kokoro-subject
    operatorContext:
      type: apiKey
      in: header
      name: x-kokoro-operator
    adminRole:
      type: apiKey
      in: header
      name: x-kokoro-role
      description: Must equal billing.admin.
    operatorProxySecret:
      type: apiKey
      in: header
      name: x-kokoro-proxy-secret
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
    wechatSignature:
      type: apiKey
      in: header
      name: Wechatpay-Signature
  schemas:
    MeteringRational:
      type: object
      additionalProperties: false
      required:
        - numerator
        - denominator
      properties:
        numerator:
          type: string
          pattern: ^(?:0|[1-9][0-9]{0,77})$(?![\s\S])
          maxLength: 78
        denominator:
          type: string
          pattern: ^[1-9][0-9]{0,77}$(?![\s\S])
          maxLength: 78
    MeteringRate:
      type: object
      additionalProperties: false
      required:
        - model_revision
        - provider_ref
        - environment
        - pricing_account_ref
        - model_ref
        - model_version
        - bucket
        - unit
        - applicability
        - currency_code
        - minor_per_unit
      properties:
        model_revision:
          type: object
          additionalProperties: false
          required:
            - id
            - content_digest
          properties:
            id:
              type: string
              format: uuid
              pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$(?![\s\S])
            content_digest:
              type: string
              pattern: ^[0-9a-f]{64}$(?![\s\S])
        provider_ref:
          type: string
          minLength: 1
          maxLength: 255
        environment:
          type: string
          minLength: 1
          maxLength: 255
        pricing_account_ref:
          type: string
          minLength: 1
          maxLength: 255
        model_ref:
          type: string
          minLength: 1
          maxLength: 255
        model_version:
          type: string
          minLength: 1
          maxLength: 255
        bucket:
          type: string
          minLength: 1
          maxLength: 128
        unit:
          type: string
          minLength: 1
          maxLength: 128
        applicability:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - kind
              properties:
                kind:
                  type: string
                  const: all
            - type: object
              additionalProperties: false
              required:
                - kind
                - dimension
                - unit
                - lower_inclusive
                - upper_exclusive
              properties:
                kind:
                  type: string
                  const: range
                dimension:
                  type: string
                  minLength: 1
                  maxLength: 128
                unit:
                  type: string
                  minLength: 1
                  maxLength: 128
                lower_inclusive:
                  type: string
                  pattern: ^(?:0|[1-9][0-9]{0,77})$(?![\s\S])
                  maxLength: 19
                upper_exclusive:
                  type:
                    - string
                    - "null"
                  pattern: ^(?:0|[1-9][0-9]{0,18})$(?![\s\S])
                  maxLength: 19
        currency_code:
          $ref: "#/components/schemas/CurrencyCode"
        minor_per_unit:
          $ref: "#/components/schemas/MeteringRational"
    MeteringRateConfiguration:
      type: object
      additionalProperties: false
      required:
        - effective_from
        - source_ref
        - verified_at
        - rates
      properties:
        effective_from: &a1
          type: string
          format: date-time
          pattern: ^[1-9][0-9]{3}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$(?![\s\S])
        source_ref: &a2
