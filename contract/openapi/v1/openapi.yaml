components:
  headers:
    CacheControlNoStore:
      schema:
        type: string
        const: no-store
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Location:
      required: true
      schema:
        type: string
        format: uri-reference
  parameters:
    PersonalTenantId:
      name: x-kokoro-tenant-id
      in: header
      required: true
      schema:
        type: string
        minLength: 5
        maxLength: 1022
        pattern: ^u1\.(?=[A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048]|[A-Za-z0-9_-][AQgw])?$(?![\s\S])
    PersonalSubjectId:
      name: x-kokoro-subject
      in: header
      required: false
      schema:
        type: string
        minLength: 5
        maxLength: 1363
        pattern: ^u1\.(?=[A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048]|[A-Za-z0-9_-][AQgw])?$(?![\s\S])
    TenantId:
      name: x-kokoro-tenant-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 191
    IdempotencyKey:
      name: idempotency-key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[\x20-\x7E]+$
    ConsumptionToken:
      name: x-billing-consumption-token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 16384
    OperatorId:
      name: x-kokoro-operator-id
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    WechatTimestamp:
      name: Wechatpay-Timestamp
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    WechatNonce:
      name: Wechatpay-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  securitySchemes:
