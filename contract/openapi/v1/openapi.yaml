openapi: 3.1.0
info:
  title: Kokoro Billing Internal Owner API
  version: 4.0.0-experimental.10
  description: Experimental clean-slate target contract; not deployed.
servers:
  - url: https://billing.internal
paths:
  /healthz:
    get:
      operationId: getHealth
      x-kokoro-owner: kokoro-billing
      x-kokoro-visibility: internal-owner
      x-kokoro-stability: experimental
      x-kokoro-idempotency: inherent
      x-kokoro-permission: none
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      operationId: getReadiness
      x-kokoro-owner: kokoro-billing
      x-kokoro-visibility: internal-owner
      x-kokoro-stability: experimental
      x-kokoro-idempotency: inherent
      x-kokoro-permission: none
      security: []
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: Not ready
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /metrics:
    get:
      operationId: getMetrics
      x-kokoro-owner: kokoro-billing
      x-kokoro-visibility: internal-owner
      x-kokoro-stability: experimental
      x-kokoro-idempotency: inherent
      x-kokoro-permission: none
      security: []
      responses:
        "200":
          description: Prometheus metrics
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            text/plain; version=0.0.4:
              schema:
                type: string
  /v1/commerce/catalog:
    get:
      operationId: getCatalog
      x-kokoro-owner: kokoro-billing
      x-kokoro-visibility: internal-owner
      x-kokoro-stability: experimental
      x-kokoro-idempotency: read-only
      x-kokoro-permission: authenticated-user-or-web-bff
      security:
        - tenantContext: []
          userBearer: []
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
          serviceBearer: []
      description:
        Authenticated IAM user or complete web-bff machine credentials;
        tenant uses the canonical u1 identity header. Machine subject is
        optional but must be a unique valid u1 subject if present. Partial
        machine identity never falls back to user authentication.
      x-kokoro-identity-transport: catalog-identity-u1
      x-kokoro-auth-selection:
        machine_markers:
          - x-kokoro-service
          - x-kokoro-internal-secret
          - x-kokoro-subject
        service_bearer_selects_machine: true
        machine_partial_response: 403
        machine_to_user_fallback: false
      parameters:
        - $ref: "#/components/parameters/PersonalTenantId"
        - $ref: "#/components/parameters/PersonalSubjectId"
        - name: x-kokoro-service
          in: header
          required: false
          schema:
            type: string
            const: web-bff
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Success
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "400":
          description: Request failed
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.invalid_request
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.unauthenticated
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.forbidden
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.not_found
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal failure
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.internal_error
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Dependency unavailable
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.dependency_unavailable
              retryable: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
