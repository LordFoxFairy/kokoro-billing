              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.idempotency_conflict
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Invalid state
          headers:
            cache-control:
              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.price_unavailable
              retryable: false
            - code: billing.insufficient_credit
              retryable: false
            - code: billing.invalid_state
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
