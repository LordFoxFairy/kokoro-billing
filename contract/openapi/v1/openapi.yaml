  /v1/internal/billing/admissions:
    post:
      operationId: createAdmission
      x-kokoro-owner: kokoro-billing
      x-kokoro-visibility: internal-owner
      x-kokoro-stability: experimental
      x-kokoro-idempotency: required
      x-kokoro-permission: web-bff-model-admission
      security:
        - serviceCaller: []
          internalSecret: []
          serviceBearer: []
          tenantContext: []
          subjectContext: []
      parameters:
        - $ref: "#/components/parameters/PersonalTenantId"
        - name: x-kokoro-subject
          in: header
          required: true
          schema:
            type: string
            minLength: 5
            maxLength: 1363
            pattern: ^u1\.(?=[A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2}[AEIMQUYcgkosw048]|[A-Za-z0-9_-][AQgw])?$(?![\s\S])
        - name: x-kokoro-service
          in: header
          required: true
          schema:
            type: string
            const: web-bff
        - name: idempotency-key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: ^[\x21-\x7e]{8,128}$(?![\s\S])
        - name: x-billing-execution-proof
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 16384
            pattern: ^[\x21-\x7e]{1,16384}$(?![\s\S])
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdmissionCreateRequest"
      responses:
        "201":
          description: Success
          headers:
            cache-control:
              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdmissionResponse"
        "400":
          description: Request failed
          headers:
            cache-control:
              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.invalid_request
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          headers:
            cache-control:
              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.unauthenticated
              retryable: false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          headers:
            cache-control:
              $ref: "#/components/headers/CacheControlNoStore"
            x-request-id:
              $ref: "#/components/headers/RequestId"
          x-kokoro-errors:
            - code: billing.forbidden
              retryable: false
          content:
            application/json:
              schema:
