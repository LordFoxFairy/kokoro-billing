openapi: 3.0.3
info:
  title: Kokoro Billing API v1
  version: 1.0.0
  description: User, admin, internal and provider-webhook contracts for kokoro-billing.
servers:
  - url: https://TARGET
security: []
tags:
  - name: User
  - name: Admin
  - name: Internal
  - name: Webhook
  - name: Operations
paths:
  /healthz:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Health"
  /readyz:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          $ref: "#/components/responses/Ready"
        "503":
          $ref: "#/components/responses/Error"
  /metrics:
    get:
      tags:
        - Operations
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /billing/plans:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      responses:
        "200":
          $ref: "#/components/responses/Plans"
  /billing/checkout:
    post:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CheckoutRequest"
      responses:
        "201":
          $ref: "#/components/responses/Checkout"
        "409":
          $ref: "#/components/responses/Error"
  /billing/me/credit-account:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      responses:
        "200":
          $ref: "#/components/responses/CreditAccount"
  /billing/redeem:
    post:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses:
        "201":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /admin/billing/redeem-campaigns:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorProxy: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignKey
                - programKey
                - creditMicros
                - maxRedemptions
                - reason
              additionalProperties: false
      responses:
        "201":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/Error"
  /admin/billing/redeem-campaigns/{campaignId}/batches:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorProxy: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - count
                - reason
              additionalProperties: false
      responses:
        "201":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/Error"
  /admin/billing/redeem-codes/{codeId}/disable:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorProxy: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: codeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              additionalProperties: false
      responses:
        "204":
          description: Disabled
        "400":
          $ref: "#/components/responses/Error"
  /billing/webhooks/{provider}:
    post:
      tags:
        - Webhook
      description: Provider-specific signature verification happens before parsing or
        tenant resolution. Stripe uses `Stripe-Signature`, WeChat Pay uses
        `Wechatpay-*` headers, Alipay signs the form body, and the local mock
        uses `X-Kokoro-Webhook-Signature`. The provider-account registry is the
        tenant authority; payload `tenantId` is only a consistency check and
        legacy payload `siteId` is accepted only for that same check.
      security:
        - stripeSignature: []
        - wechatSignature: []
        - alipayBodySignature: []
        - mockSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - stripe
              - alipay
              - wechat
              - mock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /internal/billing/entitlement/holds:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/HoldRequest"
      responses:
        "201":
          $ref: "#/components/responses/Hold"
        "409":
          $ref: "#/components/responses/Error"
  /internal/billing/entitlement/accounts/ensure:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      description: Idempotent natural-key upsert by (tenantId, subjectId); no
        Idempotency-Key is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subjectId
              properties:
                subjectId:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/EnsureAccount"
  /internal/billing/entitlement/accounts/summary:
    get:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/AccountSummary"
  /internal/billing/entitlement/accounts/ledger:
    get:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ledger"
  /internal/billing/entitlement/accounts/by-model:
    get:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: subjectId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ByModel"
  /internal/billing/entitlement/quotes:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      description: Side-effect-free pricing calculation; no Idempotency-Key is required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - featureKey
                - labelKey
              properties:
                featureKey:
                  type: string
                labelKey:
                  type: string
                  nullable: true
                inputTokens:
                  type: integer
                  minimum: 0
                outputTokens:
                  type: integer
                  minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/Quote"
  /internal/billing/entitlement/holds/{holdId}/release:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/HoldId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/Released"
  /internal/billing/entitlement/usage/events:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UsageEventRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /internal/billing/entitlement/usage/settle:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - holdId
              properties:
                holdId:
                  type: string
                  format: uuid
                usageEventId:
                  type: string
                  format: uuid
                actualMicros:
                  type: string
                  pattern: ^[0-9]+$
                inputTokens:
                  type: integer
                  minimum: 0
                outputTokens:
                  type: integer
                  minimum: 0
      responses:
        "200":
          $ref: "#/components/responses/Settled"
  /internal/billing/payment/settlements/accept:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/SettlementRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
  /admin/billing/plans:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          description: Published plans visible to the operator site
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
                  requestId:
                    type: string
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AdminPlanRequest"
      responses:
        "201":
          $ref: "#/components/responses/Plan"
        "409":
          $ref: "#/components/responses/Error"
  /admin/billing/usage-pricing:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          description: Active usage pricing rates visible to the operator site
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - featureKey
                        - pricingRevisionId
                        - inputMicrosPerMillion
                        - outputMicrosPerMillion
                        - reservationMicros
                      properties:
                        featureKey:
                          type: string
                        labelKey:
                          type: string
                          nullable: true
                        modelBindingId:
                          type: string
                          nullable: true
                        pricingRevisionId:
                          type: string
                          format: uuid
                        inputMicrosPerMillion:
                          type: string
                          pattern: ^[0-9]+$
                        outputMicrosPerMillion:
                          type: string
                          pattern: ^[0-9]+$
                        reservationMicros:
                          type: string
                          pattern: ^[0-9]+$
                  requestId:
                    type: string
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AdminUsagePricingRequest"
      responses:
        "201":
          $ref: "#/components/responses/UsagePricing"
        "409":
          $ref: "#/components/responses/Error"
  /admin/billing/grants:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/AdminGrantRequest"
      responses:
        "201":
          $ref: "#/components/responses/Grant"
        "409":
          $ref: "#/components/responses/Error"
  /admin/billing/reconcile:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          $ref: "#/components/responses/Reconcile"
  /admin/billing/stats:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          $ref: "#/components/responses/AdminStats"
  /admin/billing/credit-operations:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          description: Tenant-scoped credit grant operations
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  requestId:
                    type: string
  /admin/billing/payment-operations:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          description: Tenant-scoped checkout, settlement and reversal facts
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - requestId
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  requestId:
                    type: string
  /admin/billing/manifest:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      responses:
        "200":
          $ref: "#/components/responses/Generic"
  /admin/billing/provider-events/{providerEventId}/retry:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - name: providerEventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderEventRetryRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/Error"
  /admin/billing/provider-events:
    get:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - received
              - processed
              - ignored
              - failed
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          $ref: "#/components/responses/ProviderEvents"
  /admin/billing/refunds/{settlementId}:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRefundRequest"
      responses:
        "202":
          $ref: "#/components/responses/Accepted"
        "409":
          $ref: "#/components/responses/Error"
  /v1/commerce/catalog:
    get:
      tags:
        - User
      description: >-
        The storefront catalog accepts either an IAM user JWT or the trusted web-bff service-auth form. The BFF form requires X-Kokoro-Service=web-bff, X-Kokoro-Internal-Secret, Authorization: Bearer BFF_SERVICE_TOKEN, and X-Kokoro-Tenant-Id.
      security:
        - tenantContext: []
          userBearer: []
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
          serviceBearer: []
      responses:
        "200":
          $ref: "#/components/responses/V1Plans"
        "401":
          $ref: "#/components/responses/V1Error"
        "403":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/credit-account:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      responses:
        "200":
          $ref: "#/components/responses/V1CreditAccount"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/credit-ledger:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/V1Ledger"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions/{admissionId}/capture:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/entitlement/admissions/{admissionId}/release:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - name: admissionId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/internal/billing/execution-events:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/payment/settlements/accept:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/payment/refunds/accept:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/internal/commands/expire-credit-holds:
    post:
      tags:
        - Internal
      security:
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
  /v1/webhooks/payment/{provider}:
    post:
      tags:
        - Webhook
      security:
        - stripeSignature: []
        - wechatSignature: []
        - alipayBodySignature: []
        - mockSignature: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/me/subscriptions:
    get:
      tags:
        - User
      security:
        - tenantContext: []
          userBearer: []
      responses:
        "200":
          $ref: "#/components/responses/V1Generic"
        "401":
          $ref: "#/components/responses/V1Error"
  /v1/billing/checkout:
    post:
      tags:
        - User
      description: >-
        The storefront checkout accepts either an IAM user JWT or the trusted web-bff service-auth form. The BFF form additionally requires the authenticated X-Kokoro-Subject context so Billing can bind the checkout to the user.
      security:
        - tenantContext: []
          userBearer: []
        - tenantContext: []
          serviceCaller: []
          internalSecret: []
          serviceBearer: []
          subjectContext: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/V1CheckoutRequest"
      responses:
        "201":
          $ref: "#/components/responses/V1Checkout"
        "401":
          $ref: "#/components/responses/V1Error"
        "400":
          $ref: "#/components/responses/V1Error"
        "403":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
  /v1/admin/billing/refunds:
    post:
      tags:
        - Admin
      security:
        - tenantContext: []
          operatorContext: []
          adminRole: []
          operatorProxySecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/V1Accepted"
        "400":
          $ref: "#/components/responses/V1Error"
        "409":
          $ref: "#/components/responses/V1Error"
components:
  securitySchemes:
    tenantContext:
      type: apiKey
      in: header
      name: X-Kokoro-Tenant-Id
      description: Opaque tenant context at most 191 characters; for User routes it must match the IAM JWT tenant_id claim.
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: IAM RS256/JWKS access token.
    serviceCaller:
      type: apiKey
      in: header
      name: X-Kokoro-Service
      description: Registered internal caller identity.
    internalSecret:
      type: apiKey
      in: header
      name: X-Kokoro-Internal-Secret
      description: Per-caller internal credential.
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service
      description: >-
        BFF service credential carried as Authorization: Bearer BFF_SERVICE_TOKEN; it is checked together with X-Kokoro-Service and X-Kokoro-Internal-Secret.
    subjectContext:
      type: apiKey
      in: header
      name: X-Kokoro-Subject
      description: Trusted subject context injected by web-bff; required for the BFF checkout alternative and never accepted from a browser.
    operatorContext:
      type: apiKey
      in: header
      name: X-Kokoro-Operator
      description: Authenticated operator identity injected by the admin gateway.
    adminRole:
      type: apiKey
      in: header
      name: X-Kokoro-Role
      description: Authorized billing admin role injected by the admin gateway.
    operatorProxySecret:
      type: apiKey
      in: header
      name: X-Kokoro-Proxy-Secret
      description: Dedicated admin gateway credential; distinct from the internal
        service secret.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe signed raw-body header.
    wechatSignature:
      type: apiKey
      in: header
      name: Wechatpay-Signature
      description: WeChat Pay signed raw-body header; timestamp and nonce are also required.
    alipayBodySignature:
      type: apiKey
      in: query
      name: sign
      description: Alipay RSA2 signature is carried in the signed form body; this
        scheme documents the body field rather than a header.
    mockSignature:
      type: apiKey
      in: header
      name: X-Kokoro-Webhook-Signature
      description: Local fixture-only HMAC signature.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    HoldId:
      name: holdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CheckoutRequest"
    V1CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/V1CheckoutRequest"
    HoldRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HoldRequest"
    UsageEventRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UsageEventRequest"
    SettlementRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SettlementRequest"
    AdminPlanRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminPlanRequest"
    AdminUsagePricingRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminUsagePricingRequest"
    AdminGrantRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminGrantRequest"
    AdminRefundRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminRefundRequest"
  schemas:
    HealthResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - module
            - status
          properties:
            module:
              type: string
              enum:
                - kokoro-billing
            status:
              type: string
              enum:
                - ok
    ReadyResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - module
            - status
            - dependencies
          properties:
            module:
              type: string
              enum:
                - kokoro-billing
            status:
              type: string
              enum:
                - ready
            dependencies:
              type: object
              required:
                - postgres
                - redis
              properties:
                postgres:
                  type: string
                  enum:
                    - ok
                redis:
                  type: string
                  enum:
                    - ok
    CheckoutRequest:
      type: object
      required:
        - offerRevisionId
        - amountMinor
        - currency
        - quoteSnapshot
      properties:
        offerRevisionId:
          type: string
          format: uuid
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        quoteSnapshot:
          type: object
          additionalProperties: true
    HoldRequest:
      type: object
      required:
        - accountId
        - requestedMicros
        - featureKey
      properties:
        accountId:
          type: string
          format: uuid
        requestedMicros:
          type: string
          pattern: ^[0-9]+$
        featureKey:
          type: string
        labelKey:
          type: string
          nullable: true
        modelBindingId:
          type: string
          nullable: true
        pricingRevisionId:
          type: string
          format: uuid
          nullable: true
    UsageEventRequest:
      type: object
      required:
        - usageEventId
        - sourceEventId
        - subjectId
        - featureKey
        - quantityMicros
      properties:
        usageEventId:
          type: string
          format: uuid
        sourceEventId:
          type: string
        subjectId:
          type: string
          format: uuid
        featureKey:
          type: string
        quantityMicros:
          type: string
          pattern: ^[0-9]+$
        dimensions:
          type: object
          additionalProperties: true
    SettlementRequest:
      type: object
      required:
        - settlementId
        - externalPaymentRef
        - amountMinor
        - currency
      properties:
        settlementId:
          type: string
          format: uuid
        provider:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          description: Provider namespace; defaults to internal for trusted internal
            settlement imports.
        externalPaymentRef:
          type: string
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
    AdminPlanRequest:
      type: object
      required:
        - offerKey
        - name
        - currency
        - amountMinor
        - creditMicros
        - billingInterval
        - reason
      properties:
        offerKey:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        creditMicros:
          type: string
          pattern: ^[0-9]+$
        billingInterval:
          type: string
          enum:
            - once
            - month
            - year
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AdminUsagePricingRate:
      type: object
      required:
        - featureKey
        - inputMicrosPerMillion
        - outputMicrosPerMillion
        - reservationMicros
      properties:
        featureKey:
          type: string
          minLength: 1
        labelKey:
          type: string
          nullable: true
        modelBindingId:
          type: string
          nullable: true
        inputMicrosPerMillion:
          type: string
          pattern: ^[0-9]+$
        outputMicrosPerMillion:
          type: string
          pattern: ^[0-9]+$
        reservationMicros:
          type: string
          pattern: ^[1-9][0-9]*$
    AdminUsagePricingRequest:
      type: object
      required:
        - rates
        - reason
      properties:
        effectiveFrom:
          type: string
          format: date-time
        rates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AdminUsagePricingRate"
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AdminGrantRequest:
      type: object
      required:
        - accountId
        - subjectId
        - amountMicros
        - programKey
        - reason
      properties:
        accountId:
          type: string
          format: uuid
        subjectId:
          type: string
        amountMicros:
          type: string
          pattern: ^[0-9]+$
        programKey:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 500
    AdminRefundRequest:
      type: object
      required:
        - accountId
        - externalReversalRef
        - amountMinor
        - amountMicros
        - reason
      properties:
        accountId:
          type: string
          format: uuid
        externalReversalRef:
          type: string
          minLength: 1
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        amountMicros:
          type: string
          pattern: ^[0-9]+$
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ProviderEventRetryRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    Error:
      type: object
      required:
        - error
        - requestId
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
        requestId:
          type: string
    GenericData:
      type: object
      additionalProperties: true
    GenericResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/GenericData"
        requestId:
          type: string
    CreditAccountData:
      type: object
      required:
        - accountId
        - status
        - availableMicros
        - heldMicros
        - generation
        - grants
      properties:
        accountId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - active
            - disabled
        availableMicros:
          type: string
          pattern: ^[0-9]+$
        heldMicros:
          type: string
          pattern: ^[0-9]+$
        generation:
          type: string
          pattern: ^[0-9]+$
        grants:
          type: array
          items:
            type: object
            required:
              - creditGrantId
              - programKey
              - originalMicros
              - remainingMicros
              - status
            properties:
              creditGrantId:
                type: string
                format: uuid
              programKey:
                type: string
              originalMicros:
                type: string
                pattern: ^[0-9]+$
              remainingMicros:
                type: string
                pattern: ^[0-9]+$
              status:
                type: string
    CreditAccountResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/CreditAccountData"
        requestId:
          type: string
    LedgerEntry:
      type: object
      required:
        - entryId
        - deltaMicros
        - balanceAfterMicros
        - reason
        - createdAt
        - runId
      properties:
        entryId:
          type: string
          format: uuid
        deltaMicros:
          type: string
          pattern: ^-?[0-9]+$
        balanceAfterMicros:
          type: string
          pattern: ^-?[0-9]+$
        reason:
          type: string
        createdAt:
          type: integer
          format: int64
        runId:
          type: string
          nullable: true
    LedgerData:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LedgerEntry"
        nextCursor:
          type: string
    LedgerResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/LedgerData"
        requestId:
          type: string
    AccountSummaryData:
      type: object
      required:
        - balanceMicros
        - heldMicros
        - quotaMicros
        - quotaPeriod
      properties:
        balanceMicros:
          type: string
          pattern: ^[0-9]+$
        heldMicros:
          type: string
          pattern: ^[0-9]+$
        quotaMicros:
          type: string
          pattern: ^[0-9]+$
          nullable: true
        quotaPeriod:
          type: string
          nullable: true
    AccountSummaryResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/AccountSummaryData"
        requestId:
          type: string
    ByModelItem:
      type: object
      required:
        - modelBindingId
        - modelName
        - spentMicros
        - runCount
      properties:
        modelBindingId:
          type: string
          nullable: true
        modelName:
          type: string
        spentMicros:
          type: string
          pattern: ^[0-9]+$
        runCount:
          type: integer
          minimum: 0
    ByModelData:
      type: object
      required:
        - periodStart
        - items
      properties:
        periodStart:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/ByModelItem"
    ByModelResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/ByModelData"
        requestId:
          type: string
    QuoteData:
      type: object
      required:
        - featureKey
        - labelKey
        - pricingRevisionId
        - inputTokens
        - outputTokens
        - amountMicros
        - reservationMicros
      properties:
        featureKey:
          type: string
        labelKey:
          type: string
          nullable: true
        pricingRevisionId:
          type: string
          format: uuid
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        amountMicros:
          type: string
          pattern: ^[0-9]+$
        reservationMicros:
          type: string
          pattern: ^[0-9]+$
    QuoteResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/QuoteData"
        requestId:
          type: string
    HoldAllocation:
      type: object
      required:
        - grantId
        - amountMicros
      properties:
        grantId:
          type: string
          format: uuid
        amountMicros:
          type: string
          pattern: ^[0-9]+$
    HoldData:
      type: object
      required:
        - holdId
        - allocations
      properties:
        holdId:
          type: string
          format: uuid
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/HoldAllocation"
    HoldResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/HoldData"
        requestId:
          type: string
    SettledData:
      type: object
      required:
        - settlementId
        - capturedMicros
        - releasedMicros
      properties:
        settlementId:
          type: string
          format: uuid
        capturedMicros:
          type: string
          pattern: ^[0-9]+$
        releasedMicros:
          type: string
          pattern: ^[0-9]+$
    SettledResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/SettledData"
        requestId:
          type: string
    EnsureAccountData:
      type: object
      required:
        - accountId
      properties:
        accountId:
          type: string
          format: uuid
    EnsureAccountResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/EnsureAccountData"
        requestId:
          type: string
    ReleasedData:
      type: object
      required:
        - holdId
        - releasedMicros
      properties:
        holdId:
          type: string
          format: uuid
        releasedMicros:
          type: string
          pattern: ^[0-9]+$
    ReleasedResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/ReleasedData"
        requestId:
          type: string
    ProviderEvent:
      type: object
      required:
        - providerEventId
        - provider
        - externalEventId
        - eventType
        - processingStatus
        - processingAttempts
        - lastError
        - receivedAt
        - processedAt
      properties:
        providerEventId:
          type: string
          format: uuid
        provider:
          type: string
        externalEventId:
          type: string
        eventType:
          type: string
        processingStatus:
          type: string
          enum:
            - received
            - processed
            - ignored
            - failed
        processingAttempts:
          type: integer
          minimum: 0
        lastError:
          type: string
          nullable: true
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type: string
          format: date-time
          nullable: true
    ProviderEventsData:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProviderEvent"
        nextCursor:
          type: string
          nullable: true
    ProviderEventsResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/ProviderEventsData"
        requestId:
          type: string
    CheckoutData:
      type: object
      required:
        - checkoutId
        - status
        - amountMinor
        - currency
        - expiresAt
      properties:
        checkoutId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - created
            - pending_payment
            - paid
            - cancelled
            - expired
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        expiresAt:
          type: string
          format: date-time
        checkoutUrl:
          type: string
          format: uri
    CheckoutResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/CheckoutData"
        requestId:
          type: string
    Plan:
      type: object
      required:
        - id
        - key
        - name
        - currency
        - amountMinor
        - creditMicros
        - billingInterval
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amountMinor:
          type: string
          pattern: ^[0-9]+$
        creditMicros:
          type: string
          pattern: ^[0-9]+$
        billingInterval:
          type: string
          enum:
            - once
            - month
            - year
    PlansData:
      type: object
      required:
        - plans
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/Plan"
    PlanResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/Plan"
        requestId:
          type: string
    UsagePricingResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          type: object
          required:
            - pricingRevisionId
            - revision
            - effectiveFrom
            - rates
          properties:
            pricingRevisionId:
              type: string
              format: uuid
            revision:
              type: integer
              minimum: 1
            effectiveFrom:
              type: string
              format: date-time
            rates:
              type: array
              items:
                $ref: "#/components/schemas/AdminUsagePricingRate"
        requestId:
          type: string
    GrantData:
      type: object
      required:
        - grantId
        - journalId
      properties:
        grantId:
          type: string
          format: uuid
        journalId:
          type: string
          format: uuid
    GrantResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/GrantData"
        requestId:
          type: string
    ReconcileReport:
      type: object
      required:
        - status
        - accountDrifts
        - settlementDrifts
        - reversalDrifts
        - providerEventDrifts
      properties:
        status:
          type: string
          enum:
            - ok
            - drift
        accountDrifts:
          type: array
          items:
            type: object
            additionalProperties: true
        settlementDrifts:
          type: array
          items:
            type: object
            additionalProperties: true
        reversalDrifts:
          type: array
          items:
            type: object
            additionalProperties: true
        providerEventDrifts:
          type: array
          items:
            type: object
            additionalProperties: true
    ReconcileResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/ReconcileReport"
        requestId:
          type: string
    AdminStats:
      type: object
      required:
        - checkouts
        - settlements
        - reversals
        - providerEvents
        - credit
      properties:
        checkouts:
          type: object
          additionalProperties:
            type: string
        settlements:
          type: object
          required:
            - byStatus
            - succeededAmountMinorByCurrency
          properties:
            byStatus:
              type: object
              additionalProperties:
                type: string
            succeededAmountMinorByCurrency:
              type: object
              additionalProperties:
                type: string
        reversals:
          type: object
          required:
            - byStatus
            - succeededAmountMinorByCurrency
          properties:
            byStatus:
              type: object
              additionalProperties:
                type: string
            succeededAmountMinorByCurrency:
              type: object
              additionalProperties:
                type: string
        providerEvents:
          type: object
          additionalProperties:
            type: string
        credit:
          type: object
          required:
            - accountCount
            - grantCount
            - remainingMicros
          properties:
            accountCount:
              type: string
              pattern: ^[0-9]+$
            grantCount:
              type: string
              pattern: ^[0-9]+$
            remainingMicros:
              type: string
              pattern: ^[0-9]+$
    AdminStatsResponse:
      type: object
      required:
        - data
        - requestId
      properties:
        data:
          $ref: "#/components/schemas/AdminStats"
        requestId:
          type: string
    V1Meta:
      type: object
      required:
        - request_id
      properties:
        request_id:
          type: string
    V1GenericData:
      type: object
      additionalProperties: true
    V1SuccessResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1GenericData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1ErrorResponse:
      type: object
      required:
        - error
        - meta
      properties:
        error:
          type: object
          required:
            - code
            - message
            - request_id
            - retryable
            - details
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CheckoutRequest:
      type: object
      required:
        - offer_revision_id
        - amount_minor
        - currency
        - quote_snapshot
      additionalProperties: false
      properties:
        offer_revision_id:
          type: string
        amount_minor:
          type: string
          pattern: ^[1-9][0-9]*$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        quote_snapshot:
          $ref: "#/components/schemas/V1QuoteSnapshot"
    V1QuoteSnapshot:
      type: object
      required:
        - key
        - credit_micros
      properties:
        key:
          type: string
          minLength: 1
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        name:
          type: string
      additionalProperties: true
    V1Plan:
      type: object
      required:
        - id
        - key
        - name
        - currency
        - amount_minor
        - credit_micros
        - billing_interval
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        amount_minor:
          type: string
          pattern: ^[0-9]+$
        credit_micros:
          type: string
          pattern: ^[0-9]+$
        billing_interval:
          type: string
          enum:
            - once
            - month
            - year
    V1PlansData:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/V1Plan"
    V1CreditAccountData:
      type: object
      required:
        - account_id
        - status
        - available_micros
        - held_micros
        - generation
        - grants
      properties:
        account_id:
          type: string
        status:
          type: string
          enum:
            - active
            - disabled
        available_micros:
          type: string
          pattern: ^[0-9]+$
        held_micros:
          type: string
          pattern: ^[0-9]+$
        generation:
          type: string
          pattern: ^[0-9]+$
        grants:
          type: array
          items:
            type: object
            required:
              - credit_grant_id
              - program_key
              - original_micros
              - remaining_micros
              - effective_at
              - expires_at
              - burn_priority
              - status
            properties:
              credit_grant_id:
                type: string
              program_key:
                type: string
              original_micros:
                type: string
                pattern: ^[0-9]+$
              remaining_micros:
                type: string
                pattern: ^[0-9]+$
              effective_at:
                type: string
                format: date-time
              expires_at:
                type: string
                format: date-time
                nullable: true
              burn_priority:
                type: integer
              status:
                type: string
    V1LedgerEntry:
      type: object
      required:
        - entry_id
        - delta_micros
        - balance_after_micros
        - reason
        - created_at
        - run_id
      properties:
        entry_id:
          type: string
        delta_micros:
          type: string
          pattern: ^-?[0-9]+$
        balance_after_micros:
          type: string
          pattern: ^-?[0-9]+$
        reason:
          type: string
        created_at:
          type: integer
          format: int64
        run_id:
          type: string
          nullable: true
    V1LedgerData:
      type: object
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/V1LedgerEntry"
        next_cursor:
          type: string
    V1CheckoutData:
      type: object
      required:
        - checkout_id
        - status
        - amount_minor
        - currency
        - expires_at
      properties:
        checkout_id:
          type: string
        status:
          type: string
          enum:
            - created
            - pending_payment
            - paid
            - cancelled
            - expired
        amount_minor:
          type: string
          pattern: ^[0-9]+$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        expires_at:
          type: string
          format: date-time
        checkout_url:
          type: string
          format: uri
    V1PlansResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1PlansData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CreditAccountResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1CreditAccountData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1LedgerResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1LedgerData"
        meta:
          $ref: "#/components/schemas/V1Meta"
    V1CheckoutResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: "#/components/schemas/V1CheckoutData"
        meta:
          $ref: "#/components/schemas/V1Meta"
